<svg width="680" viewBox="0 0 680 570" xmlns="http://www.w3.org/2000/svg" style="background:white;font-family:sans-serif">
  <style>
    .th { font-size:14px; font-weight:600; fill:#1a1a1a; }
    .ts { font-size:12px; fill:#555555; }
    .box-gray  { fill:#f5f5f4; stroke:#c4c4c0; }
    .box-teal  { fill:#e1f5ee; stroke:#0f6e56; }
    .box-purple{ fill:#eeedfe; stroke:#534ab7; }
    .box-amber { fill:#faeeda; stroke:#854f0b; }
    .box-blue  { fill:#e6f1fb; stroke:#185fa5; }
    .box-coral { fill:#faece7; stroke:#993c1d; }
    .th-gray   { fill:#2c2c2a; }
    .th-teal   { fill:#085041; }
    .th-purple { fill:#26215c; }
    .th-amber  { fill:#412402; }
    .th-blue   { fill:#042c53; }
    .th-coral  { fill:#4a1b0c; }
    .ts-gray   { fill:#5f5e5a; }
    .ts-teal   { fill:#0f6e56; }
    .ts-purple { fill:#534ab7; }
    .ts-amber  { fill:#854f0b; }
    .ts-blue   { fill:#185fa5; }
    .ts-coral  { fill:#993c1d; }
  </style>

  <!-- Timeline vertical line -->
  <line x1="130" y1="40" x2="130" y2="540" stroke="#c4c4c0" stroke-width="1.5"/>

  <!-- 2012 -->
  <circle cx="130" cy="65" r="7" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
  <text class="ts ts-gray" x="118" y="69" text-anchor="end" dominant-baseline="central">2012</text>
  <rect class="box-gray" x="155" y="45" width="460" height="44" rx="8" stroke-width="0.5"/>
  <text class="th th-gray" x="172" y="62" dominant-baseline="central">Enrolled at Gachon University</text>
  <text class="ts ts-gray" x="172" y="79" dominant-baseline="central">Dept. of Exercise Rehabilitation &amp; Welfare</text>

  <!-- 2013 -->
  <circle cx="130" cy="160" r="7" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/>
  <text class="ts ts-gray" x="118" y="164" text-anchor="end" dominant-baseline="central">2013</text>
  <rect class="box-teal" x="155" y="140" width="460" height="44" rx="8" stroke-width="0.5"/>
  <text class="th th-teal" x="172" y="157" dominant-baseline="central">Republic of Korea Navy (Aug 2013 – Jul 2015)</text>
  <text class="ts ts-teal" x="172" y="174" dominant-baseline="central">Medical Corpsman</text>

  <!-- 2016 -->
  <circle cx="130" cy="255" r="7" fill="#eeedfe" stroke="#534ab7" stroke-width="1.5"/>
  <text class="ts ts-gray" x="118" y="259" text-anchor="end" dominant-baseline="central">2016</text>
  <rect class="box-purple" x="155" y="235" width="460" height="44" rx="8" stroke-width="0.5"/>
  <text class="th th-purple" x="172" y="252" dominant-baseline="central">Transferred to Software Engineering (Mar 2016)</text>
  <text class="ts ts-purple" x="172" y="269" dominant-baseline="central">Gachon University — new start</text>

  <!-- 2019 -->
  <circle cx="130" cy="350" r="7" fill="#faeeda" stroke="#854f0b" stroke-width="1.5"/>
  <text class="ts ts-gray" x="118" y="354" text-anchor="end" dominant-baseline="central">2019</text>
  <rect class="box-amber" x="155" y="330" width="460" height="44" rx="8" stroke-width="0.5"/>
  <text class="th th-amber" x="172" y="347" dominant-baseline="central">S1 Corporation Internship (Jul – Aug) · Graduated B.E. (Aug)</text>
  <text class="ts ts-amber" x="172" y="364" dominant-baseline="central">Joined KFCC as Intern (Nov 2019)</text>

  <!-- 2020 -->
  <circle cx="130" cy="445" r="7" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
  <text class="ts ts-gray" x="118" y="449" text-anchor="end" dominant-baseline="central">2020</text>
  <rect class="box-blue" x="155" y="425" width="460" height="44" rx="8" stroke-width="0.5"/>
  <text class="th th-blue" x="172" y="442" dominant-baseline="central">KFCC — Core Banking Engineer (Mar 2020 – Mar 2024)</text>
  <text class="ts ts-blue" x="172" y="459" dominant-baseline="central">Biometric auth, interbank transfer, teller systems</text>

  <!-- 2024 -->
  <circle cx="130" cy="535" r="7" fill="#faece7" stroke="#993c1d" stroke-width="1.5"/>
  <text class="ts ts-gray" x="118" y="539" text-anchor="end" dominant-baseline="central">2024</text>
  <rect class="box-coral" x="155" y="515" width="460" height="44" rx="8" stroke-width="0.5"/>
  <text class="th th-coral" x="172" y="532" dominant-baseline="central">Samsung SDS — Security Engineer (May 2024 – Present)</text>
  <text class="ts ts-coral" x="172" y="549" dominant-baseline="central">OTP, LLM modernization, financial platform</text>
</svg>
